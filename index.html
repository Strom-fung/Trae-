<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能仓储系统 - Warehouse Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Sans+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="app-container">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">🏭</div>
          <span class="logo-text">Smart Warehouse</span>
        </div>

        <nav>
          <ul class="nav-menu">
            <li><a class="nav-item active" href="index.html" data-page="dashboard">仪表盘</a></li>
            <li><a class="nav-item" href="index.html#inventory" data-page="inventory">库存管理</a></li>
            <li><a class="nav-item" href="analytics.html" data-page="analytics">数据分析</a></li>
            <li><a class="nav-item" href="settings.html" data-page="settings">系统设置</a></li>
          </ul>
        </nav>

        <div class="user-info">
          <div class="user-avatar">张</div>
          <div class="user-details">
            <div class="user-name">张伟</div>
            <div class="user-role">仓库管理员</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">
      <h2 class="section-title">数据概览</h2>

      <section class="metrics-grid" id="metrics-grid">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </section>

      <section class="dashboard-grid">
        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">📊 库存热力分布图</h3>
            <button class="btn btn-secondary" onclick="App.refresh()">
              🔄 刷新
            </button>
          </div>
          <div class="panel-body">
            <div id="heatmap-container">
              <div class="loading">
                <div class="spinner"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h3 class="panel-title">📋 最近活动</h3>
            <span style="font-size: 12px; color: var(--text-muted);">实时更新</span>
          </div>
          <div class="panel-body">
            <div id="activity-container">
              <div class="loading">
                <div class="spinner"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="inventory-section">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </section>
    </div>
  </main>

  <footer style="text-align: center; padding: 32px 0; color: var(--text-muted); font-size: 14px;">
    <p>© 2026 智能仓储管理系统 v1.0 | 技术支持: 仓库技术部</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
